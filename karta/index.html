/* =====================================================================
   НАСТРОЙКИ ПОДКЛЮЧЕНИЯ (единственное место, где вписываются адреса)
   ===================================================================== */
/* Адрес сервера в Яндекс Облаке, без косой черты в конце,
   например 'https://xxxxxxxx.apigw.yandexcloud.net'.
   Пусто — сервер не используется: всё хранится на устройстве, как в веб-версии. */
const API_BASE = '';
/* Имя бота без @ — нужно для кнопки «Отправить карту педагогу». */
const BOT_USERNAME = '';
/* Ссылка на полный текст политики конфиденциальности (пока заглушка: пусто). */
const POLICY_URL = '../privacy.html';
/* Какие карты уходят на сервер. Сейчас — только режим «Проверяю себя» (без имени).
   Карты режима «Я педагог» содержат имена учеников и остаются на устройстве.
   Чтобы включить позже: поставить true ЗДЕСЬ и добавить 'teacher' в SYNC_MODES
   в bot/bot_yc.js. Имена на сервер не уйдут и в этом случае. */
const SYNC_TEACHER_CARDS = false;
/* Номер редакции текста согласия (менять вместе с CONSENT_VERSION на сервере). */
const CONSENT_VERSION = 1;
/* Официальный скрипт Telegram. Подгружается только внутри Telegram. */
const TG_SDK_URL = 'https://telegram.org/js/telegram-web-app.js';

/* Политика безопасности (CSP): страница может загрузить скрипт только с telegram.org
   и обращаться по сети только к API_BASE. Собираем её здесь, чтобы адрес сервера
   вписывался в одном месте. Если API_BASE пуст — сетевые запросы запрещены совсем. */
(function(){
  let api = "'none'";
  try{ if(API_BASE) api = new URL(API_BASE).origin; }catch(e){}
  const m = document.createElement('meta');
  m.httpEquiv = 'Content-Security-Policy';
  m.content = "default-src 'none'; script-src 'unsafe-inline' https://telegram.org; style-src 'unsafe-inline'; img-src 'self' data:; manifest-src 'self'; connect-src " + api + "; base-uri 'none'; form-action 'none'";
  document.head.appendChild(m);
})();

<style>
/* Идея макета: одна колонка шириной с телефон, шаг за шагом.

:root{

/* =====================================================================
   ХРАНИЛИЩЕ
   Всё хранится только в браузере (localStorage). Любое обращение обёрнуто
   в try/catch: если хранилище запрещено, приложение работает без памяти.
   ===================================================================== */
/* Ключи хранилища. В веб-версии основа — 'voicemap.v1' (как раньше). В Telegram к основе
   добавляется id пользователя: два аккаунта на одном телефоне не видят карты друг друга.
   CKEY — ответ на экране согласия, QKEY — очередь того, что ещё не дошло до сервера. */
const KEY0='voicemap.v1';
let KEY, DKEY, OKEY, SKEY, WKEY, PKEY, CKEY, QKEY;
function setKeys(base){ KEY=base; DKEY=KEY+'.draft'; OKEY=KEY+'.open'; SKEY=KEY+'.seen'; WKEY=KEY+'.days'; PKEY=KEY+'.prefs'; CKEY=KEY+'.consent'; QKEY=KEY+'.queue'; }
setKeys(KEY0);
let storeOk = true;
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); return true; }catch(e){ return false; } }
function lsDel(k){ try{ localStorage.removeItem(k); }catch(e){} }
function lsJSON(k){ try{ return JSON.parse(lsGet(k)); }catch(e){ return null; } }

/* Проверка формата: из хранилища берём только то, что есть в базе знаний.
   Так испорченная или старая запись не ломает экран. */
function cleanAns(a){ const out={}; if(!a||typeof a!=='object') return out;
  PARAMS.forEach(p=>{ const ks=p.opts.map(o=>o.k), v=a[p.id];
    if(p.multi){ const arr=Array.isArray(v)?v.filter(k=>ks.includes(k)):[]; if(arr.length) out[p.id]=arr; }
    else if(ks.includes(v)) out[p.id]=v; });
  return out; }
function cleanMap(s){ if(!s||typeof s!=='object'||Array.isArray(s)||s.id==null||!isFinite(+s.id)) return null;
  return {id:+s.id, mode:s.mode==='self'?'self':'teacher', name:typeof s.name==='string'?s.name.slice(0,40):'',
    date:typeof s.date==='string'?s.date.slice(0,20):'', ans:cleanAns(s.ans), done:!!s.done,
    step:Math.min(Math.max(parseInt(s.step)||0,0),PARAMS.length-1)}; }
const clamp5 = v => { v=parseInt(v)||0; return v>=1&&v<=5?v:0; };

/* ---------- СОСТОЯНИЕ ----------
   hist  — законченные карты; draft — незавершённая диагностика (переживает перезагрузку);
   cur   — карта, открытая сейчас (черновик или копия законченной);
   days  — дни, когда сделана разминка; seen — показано ли приветствие. */
let hist, draft, opened, cur, seen, days, soundOn;
/* Читаем всё из хранилища по текущим ключам. В Telegram вызывается второй раз —
   после того как стал известен id пользователя и ключи получили его префикс. */
function loadState(){
  hist = (()=>{ const h=lsJSON(KEY); return Array.isArray(h)?h.map(cleanMap).filter(Boolean).map(s=>(s.done=true,s)):[]; })();
  draft = cleanMap(lsJSON(DKEY)); if(draft) draft.done=false;
  opened = cleanMap(lsJSON(OKEY)); if(opened) opened.done=true;
  cur = opened || draft;
  seen = !!lsJSON(SKEY);
  days = (()=>{ const d=lsJSON(WKEY); return Array.isArray(d)?d.filter(x=>x&&typeof x.d==='string'&&/^\d{4}-\d\d-\d\d$/.test(x.d)).map(x=>({d:x.d,b:clamp5(x.b),a:clamp5(x.a)})).slice(-60):[]; })();
  soundOn = !((lsJSON(PKEY)||{}).sound===false);
}
loadState();
let draftMode='teacher', draftName='', copyFail=false;
let timer = {i:0, left:WARMUP[0].t, run:false, h:null, end:0, done:false, started:false};
let feel = {b:0, a:0};   /* самооценка до (b) и после (a) разминки, 1–5 */

function saveHist(){ storeOk = lsSet(KEY, hist); }
function saveCur(){ if(!cur) return; if(cur.done) lsSet(OKEY,cur); else { draft=cur; if(!lsSet(DKEY,cur)) storeOk=false; } }
function persist(){ const c=JSON.parse(JSON.stringify(cur)); c.done=true;
  const i=hist.findIndex(s=>s.id===c.id); if(i>=0) hist[i]=c; else hist.unshift(c); hist=hist.slice(0,30); saveHist();
  Store.save(c); }   /* на устройстве уже сохранено; Store при необходимости отправит на сервер */

/* =====================================================================
   TELEGRAM
   Один и тот же файл работает и как обычная страница, и как Mini App.
   Всё, что знает про Telegram, собрано здесь. В обычном браузере этот блок
   ничего не загружает и не отправляет.
   ===================================================================== */
let tg=null;            /* объект Telegram.WebApp, если мы действительно внутри Telegram */
let inTg=false;
let consent=null;       /* 'yes' | 'no' | null (ещё не спрашивали) — ответ на экране согласия */
let closed=false;       /* сервер ответил «доступ закрыт» (нет в белом списке) */
let netNote='';         /* '' | 'offline' | 'auth' — строка о том, что карта пока только на устройстве */
let wipeNote='';        /* сообщение после «Удалить мои данные» */
let booting=false;      /* идёт запуск в Telegram: экран ещё не рисуем */
let curScr='';          /* какой экран сейчас показан */
let queue={put:[],del:[],consent:false};   /* что ещё не дошло до сервера */

/* Похоже ли, что страницу открыл Telegram. Нужно, чтобы НЕ грузить его скрипт в обычном
   браузере. Признаки: параметры tgWebApp… в адресе, служебные объекты приложения Telegram,
   отметка в sessionStorage (после перезагрузки страницы внутри Telegram). */
function tgLooks(){
  let h=''; try{ h=location.hash+'&'+location.search; }catch(e){}
  if(/tgWebApp(Data|Version|Platform)=/.test(h)) return true;
  if(window.TelegramWebviewProxy||window.TelegramGameProxy||(window.Telegram&&window.Telegram.WebApp)) return true;
  try{ return sessionStorage.getItem('vm.tg')==='1'; }catch(e){ return false; }
}
/* Подгружаем скрипт Telegram. Не загрузился за 4 секунды — работаем как обычная страница. */
function tgLoad(){
  return new Promise(res=>{
    if(window.Telegram&&window.Telegram.WebApp) return res(true);
    let done=false; const fin=ok=>{ if(!done){ done=true; res(ok); } };
    const s=document.createElement('script'); s.src=TG_SDK_URL;
    s.onload=()=>fin(!!(window.Telegram&&window.Telegram.WebApp)); s.onerror=()=>fin(false);
    document.head.appendChild(s); setTimeout(()=>fin(false),4000);
  });
}
/* Старые версии Telegram не знают новых методов: проверяем версию и глотаем ошибки */
const tgVer = v => { try{ return !!(tg&&tg.isVersionAtLeast&&tg.isVersionAtLeast(v)); }catch(e){ return false; } };
const tgSafe = fn => { try{ return fn(); }catch(e){ return undefined; } };
/* Шапка и фон Telegram — в цвет приложения (--paper) */
function tgColors(){
  if(tgVer('6.9')){ tgSafe(()=>tg.setHeaderColor('#FBF7F2')); tgSafe(()=>tg.setBackgroundColor('#FBF7F2')); }
  else if(tgVer('6.1')) tgSafe(()=>tg.setHeaderColor('bg_color'));
  if(tgVer('7.10')) tgSafe(()=>tg.setBottomBarColor('#FFFFFF'));
}
/* Отступы от «чёлки» и панелей Telegram кладём в CSS-переменные --vm-safe-* */
function tgSafeArea(){
  const a=tg.safeAreaInset||{}, c=tg.contentSafeAreaInset||{}, st=document.documentElement.style;
  ['top','bottom','left','right'].forEach(k=>st.setProperty('--vm-safe-'+k, ((+a[k]||0)+(+c[k]||0))+'px'));
}
/* Кнопка «Назад» в шапке Telegram = шаг назад: в диагностике — предыдущая проба */
function tgBack(){
  if(curScr==='check'&&cur&&cur.step>0){ cur.step--; saveCur(); render(); return; }
  go(curScr==='privacy'?'about':'start');
}
/* После каждой отрисовки: показать/спрятать «Назад»; на экране диагностики запретить
   закрытие свайпом вниз и спрашивать подтверждение — чтобы не потерять пробу случайно */
function tgSync(){
  if(!inTg) return;
  const root=['start','welcome','consent','closed'].includes(curScr), busy=curScr==='check';
  if(tgVer('6.1')&&tg.BackButton) tgSafe(()=>root?tg.BackButton.hide():tg.BackButton.show());
  if(tgVer('7.7')) tgSafe(()=>busy?tg.disableVerticalSwipes():tg.enableVerticalSwipes());
  if(tgVer('6.2')) tgSafe(()=>busy?tg.enableClosingConfirmation():tg.disableClosingConfirmation());
}
/* Метка ссылки, по которой человек пришёл (бот дописывает ?src=… к адресу) */
function tgSource(){
  let raw=''; try{ raw=String((tg.initDataUnsafe||{}).start_param||'')||new URLSearchParams(location.search).get('src')||''; }catch(e){}
  return /^[A-Za-z0-9_-]{1,64}$/.test(raw)?raw:'';
}
/* «Отправить карту педагогу»: обычная ссылка «поделиться» Telegram. Человек сам выбирает чат,
   текст уходит напрямую от него и через наш сервер не проходит. Слишком длинный текст
   или старый Telegram — возвращаем false, и кнопка скопирует карту в буфер. */
function tgShare(text){
  if(!inTg||!tg.openTelegramLink||text.length>3500) return false;
  const link=BOT_USERNAME?'https://t.me/'+BOT_USERNAME:'';
  try{ tg.openTelegramLink('https://t.me/share/url?url='+encodeURIComponent(link)+'&text='+encodeURIComponent(text)); return true; }catch(e){ return false; }
}

/* =====================================================================
   СЛОЙ ХРАНЕНИЯ (один интерфейс Store, все методы возвращают Promise)
   Сначала всегда пишем на устройство (localStorage) — это быстро и работает без сети.
   Потом, ЕСЛИ задан API_BASE, приложение открыто в Telegram и человек дал согласие,
   карты режима «Проверяю себя» дублируются на сервер. Не получилось (нет связи) —
   операция остаётся в очереди и уйдёт позже.
   ===================================================================== */
const serverOn = () => inTg && !!API_BASE && !!tg.initData;           /* сервер в принципе доступен */
const syncOn = () => serverOn() && consent==='yes' && !closed;          /* можно отправлять карты */
const syncable = c => !!c && (c.mode==='self' || SYNC_TEACHER_CARDS);   /* какие карты уходят на сервер */
const needConsent = () => serverOn() && consent===null && !closed;
function saveQueue(){ lsSet(QKEY, queue); }
function setNet(v){ if(netNote===v) return; netNote=v; if(!booting&&(curScr==='start'||curScr==='result')) render(true); }

/* Один запрос к серверу. Каждый несёт подписанную Telegram строку initData:
   по ней сервер проверяет, что запрос настоящий, и узнаёт id. Имя не отправляется никогда. */
async function api(method, path, body){
  const ctl=new AbortController(), t=setTimeout(()=>ctl.abort(), 8000);
  try{
    const h={'Authorization':'tma '+tg.initData}; if(body) h['Content-Type']='application/json';
    const r=await fetch(API_BASE+path, {method, headers:h, body:body?JSON.stringify(body):undefined, signal:ctl.signal, credentials:'omit', cache:'no-store', referrerPolicy:'no-referrer'});
    if(r.ok) return r.status===204?null:await r.json();
    const e=new Error('status '+r.status); e.status=r.status; throw e;
  } finally { clearTimeout(t); }
}
/* Разбор ошибки: 403 — доступ закрыт; 401 — подпись устарела; прочие 4xx — сервер не принял
   именно эту запись (повторять бессмысленно); остальное считаем отсутствием связи. */
function netFail(e){
  if(e&&e.status===403){ closed=true; netNote=''; if(!booting) render(); return; }
  setNet(e&&e.status===401?'auth':'offline');
}
const dropErr = e => !!(e&&e.status>=400&&e.status<500&&e.status!==401&&e.status!==403&&e.status!==429);

let flushing=null;
/* Отправляем очередь по порядку: согласие, удаления, сохранения. true — всё дошло. */
function flush(){
  if(!syncOn()) return Promise.resolve(false);
  if(flushing) return flushing;
  flushing=(async()=>{
    await null;   /* важно: даём сначала записать flushing, иначе при пустой очереди отметка «идёт отправка» осталась бы навсегда */
    try{
      if(queue.consent){ await api('POST','/api/consent',{v:CONSENT_VERSION, source:tgSource()}); queue.consent=false; saveQueue(); }
      while(queue.del.length){
        try{ await api('DELETE','/api/cards/'+queue.del[0]); }catch(e){ if(!dropErr(e)) throw e; }
        queue.del.shift(); saveQueue(); }
      while(queue.put.length){
        const id=queue.put[0], c=hist.find(s=>s.id===id);
        if(c&&syncable(c)){
          /* на сервер уходит только: дата, режим, ответы. Имени в запросе нет. */
          try{ await api('PUT','/api/cards/'+id,{date:c.date, mode:c.mode, answers:c.ans}); }catch(e){ if(!dropErr(e)) throw e; } }
        queue.put.shift(); saveQueue(); }
      setNet(''); return true;
    }catch(e){ netFail(e); return false; }
    finally{ flushing=null; }
  })();
  return flushing;
}
const Store = {
  /* Старт: дослать очередь и забрать список карт с сервера. Карты с сервера приходят без имён —
     имя подставляем из того, что лежит на устройстве. Локальные карты, которые на сервер
     не уходят (педагог) или ещё не отправлены, остаются. */
  async load(){
    if(!syncOn()) return false;
    if(!(await flush())) return false;
    try{
      const r=await api('GET','/api/cards');
      const names=new Map(hist.map(s=>[s.id,s.name]));
      const srv=((r&&Array.isArray(r.cards))?r.cards:[]).map(c=>cleanMap({id:c&&c.id, mode:c&&c.mode, date:c&&c.date, ans:c&&c.answers, done:true})).filter(Boolean);
      srv.forEach(s=>{ s.name=names.get(s.id)||''; s.done=true; });
      const keep=hist.filter(s=>!syncable(s)||queue.put.includes(s.id)), ids=new Set(keep.map(s=>s.id));
      hist=keep.concat(srv.filter(s=>!ids.has(s.id))).sort((a,b)=>b.id-a.id).slice(0,30); saveHist();
      return true;
    }catch(e){ netFail(e); return false; }
  },
  /* Сохранить карту (на устройстве она уже лежит) */
  async save(c){
    if(!syncOn()||!syncable(c)) return false;
    if(flushing||!queue.put.includes(c.id)) queue.put.push(c.id);
    saveQueue(); return flush();
  },
  /* Удалить карту */
  async remove(c){
    if(!syncOn()||!syncable(c)) return false;
    queue.put=queue.put.filter(id=>id!==c.id); if(!queue.del.includes(c.id)) queue.del.push(c.id);
    saveQueue(); return flush();
  },
  /* Ответ на экране согласия. «Да» — ставим в очередь само согласие и все уже сделанные карты. */
  async setConsent(yes){
    consent=yes?'yes':'no'; lsSet(CKEY,{v:CONSENT_VERSION, a:consent, d:dkey(new Date())});
    if(!yes) return false;
    queue.consent=true; queue.put=hist.filter(syncable).map(s=>s.id); saveQueue();
    const ok=await Store.load(); if(ok&&!booting) render(true); return ok;
  },
  /* Удалить всё: сначала на сервере (если он подключён), потом на устройстве.
     Возвращает: true — сервер подтвердил, false — не достучались, null — сервера нет. */
  async wipe(){
    let srv=null;
    if(serverOn()){ try{ await api('DELETE','/api/me'); srv=true; }catch(e){ srv=false; } }
    wipeLocal(); return srv;
  }
};
/* Стереть всё на устройстве и вернуть приложение в исходное состояние */
function wipeLocal(){
  [KEY,DKEY,OKEY,SKEY,WKEY,PKEY,CKEY,QKEY].forEach(lsDel);
  hist=[]; cur=null; draft=null; days=[]; seen=false; feel={b:0,a:0}; soundOn=true; storeOk=true;
  consent=null; queue={put:[],del:[],consent:false}; netNote='';
  stopTimer(); timer.done=false; timer.started=false; setStep(0);
}

/* Запуск внутри Telegram: грузим его скрипт, узнаём пользователя, переключаем хранилище
   на его ключи, при согласии — забираем карты с сервера, и только потом рисуем экран. */
async function bootTg(){
  booting=true; $('#app').innerHTML='<p class="muted" role="status">Загрузка…</p>';
  const ok=await tgLoad();
  const w=ok&&window.Telegram&&window.Telegram.WebApp;
  /* скрипт создаёт объект и в обычном браузере; настоящий Telegram — когда есть initData или платформа */
  inTg=!!(w&&(w.initData||(w.platform&&w.platform!=='unknown')));
  if(inTg){
    tg=w;
    try{ sessionStorage.setItem('vm.tg','1'); }catch(e){}
    document.documentElement.classList.add('in-tg');
    /* Отдельное хранилище на каждого пользователя Telegram. Имя из Telegram НЕ берём
       и в поле «Имя» ничего не подставляем: человек сам решает, что написать. */
    const uid=tgSafe(()=>tg.initDataUnsafe.user.id);
    setKeys(KEY0+'.'+(/^\d{1,20}$/.test(String(uid))?'u'+uid:'tg'));
    loadState();
    const c=lsJSON(CKEY); consent=(c&&c.v===CONSENT_VERSION&&(c.a==='yes'||c.a==='no'))?c.a:null;
    const q=lsJSON(QKEY); if(q&&Array.isArray(q.put)&&Array.isArray(q.del)) queue={put:q.put.filter(Number.isFinite), del:q.del.filter(Number.isFinite), consent:!!q.consent};
    /* Telegram дописал свои параметры в адрес после # — скрипт их уже прочитал,
       возвращаем адресу обычный вид (#start, #warmup…), чтобы работали экраны */
    try{ if(/tgWebApp/.test(location.hash)) history.replaceState(null,'',location.pathname+location.search+'#'+route()); }catch(e){}
    tgSafe(()=>tg.ready()); tgSafe(()=>tg.expand());
    tgColors(); tgSafeArea();
    tgSafe(()=>{ tg.onEvent('safeAreaChanged',tgSafeArea); tg.onEvent('contentSafeAreaChanged',tgSafeArea); tg.onEvent('themeChanged',tgColors);
      if(tg.BackButton) tg.BackButton.onClick(tgBack); });
    window.addEventListener('online', ()=>{ flush(); });
    /* ждём сервер не дольше 6 секунд: приложение должно открыться и без связи */
    if(syncOn()) await Promise.race([Store.load(), new Promise(r=>setTimeout(r,6000))]);
  }
  booting=false; render();
}

/* ---------- МЕЛКИЕ ПОМОЩНИКИ ---------- */
const $ = s => document.querySelector(s);
/* esc — экранирование: всё, что ввёл человек, выводим как текст, а не как разметку */
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = s => Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
const answered = (a,p) => p.multi ? (a[p.id]||[]).length>0 : !!a[p.id];
const ansText = (a,p) => { const v=a[p.id]; if(!v||(Array.isArray(v)&&!v.length)) return 'не отмечено'; return Array.isArray(v)?v.join(', '):v; };
const countAns = a => PARAMS.filter(p=>answered(a,p)).length;
const cap = s => s ? s[0].toUpperCase()+s.slice(1) : s;
const dkey = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const plural = (n,a,b,c) => { const m=n%100, k=n%10; return (m>10&&m<20)?c:(k===1?a:(k>=2&&k<=4?b:c)); };
function groupOf(i){ let s=0; for(const g of GROUPS){ if(i<s+g.n) return g; s+=g.n; } return GROUPS[GROUPS.length-1]; }
function groupEnds(){ const out=[]; let s=0; GROUPS.forEach(g=>{ s+=g.n; out.push(s-1); }); return out; }
/* Делим пробу на «Сделайте» (первое предложение) и «Выберите» (остальное) */
function splitQ(q){ let i=q.indexOf('. '); if(i>0) return [q.slice(0,i+1), q.slice(i+2)];
  i=q.indexOf(': '); if(i>0) return [q.slice(0,i)+'.', cap(q.slice(i+2))]; return [q,'Какое описание ближе?']; }

/* Неделя из 7 кружков: залит день, когда разминка сделана. Пропуски ничего не «сжигают». */
function weekCard(where){
  const now=new Date(), tk=dkey(now), wd=(now.getDay()+6)%7; let n=0;
  const dots=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].map((lb,i)=>{
    const k=dkey(new Date(now.getFullYear(),now.getMonth(),now.getDate()-wd+i)), on=days.some(x=>x.d===k); if(on) n++;
    return `<span class="wd${on?' on':''}${k===tk?' today':''}"><i></i>${lb}<span class="sr">${on?' — разминка сделана':''}</span></span>`; }).join('');
  const today=days.some(x=>x.d===tk);
  return `<div class="card stack" id="week"><h2>Эта неделя: ${n} из 7</h2><div class="week">${dots}</div>
    <p class="muted">${n?'Лучше 8 минут каждый день, чем час раз в неделю.':'Первая разминка займёт 8 минут. Начнём?'}</p>
    ${where==='start'?'<a class="btn ghost wide" href="#warmup">К разминке</a>':(today?'':'<button class="btn ghost wide" data-go="markday">Отметить без таймера</button>')}</div>`;
}

/* Шаг диагностики: простое название крупно, анатомическое мелко, блоки «Сделайте / Выберите» */

  const isOn = k => p.multi ? (sel||[]).includes(k) : sel===k;

  const dots = PARAMS.map((x,i)=>`<i class="${answered(a,x)?'ans':''}${i===cur.step?' now':''}${ends.includes(i)&&i<PARAMS.length-1?' gap':''}"></i>`).join('');

/* Портрет звука: собираем слова-описания (adj) из выбранных положений */
function portrait(a){
  const parts=[]; PARAMS.forEach(p=>{ if(p.multi) return; const o=p.opts.find(o=>o.k===a[p.id]); if(o&&o.adj) parts.push(o.adj); });
  return parts.join(', ');
}
/* Советы: берём tip у выбранных положений */
function tips(a){
  const out=[]; PARAMS.forEach((p,i)=>{ const v=a[p.id]; const ks=Array.isArray(v)?v:(v?[v]:[]);
    ks.forEach(k=>{ const o=p.opts.find(o=>o.k===k); if(o&&o.tip) out.push({h:p.nameS+': '+k.toLowerCase(), t:o.tip, step:i+1}); }); });
  return out;
}
const lineName = p => p.nameS + (p.nameS!==p.name ? ' ('+p.name.toLowerCase()+')' : '');
function summaryText(s){
  return 'Карта голоса'+(s.name?' — '+s.name:'')+' ('+s.date+')\n'+PARAMS.map(p=>lineName(p)+': '+ansText(s.ans,p)).join('\n')+(portrait(s.ans)?'\n\nПортрет звука: '+portrait(s.ans):'');
}
/* Прошлая карта того же человека: то же имя (без учёта регистра) и тот же режим */
function prevOf(s){
  const nm = x => (x.name||'').trim().toLowerCase();
  if(!nm(s) && s.mode!=='self') return null;
  return hist.filter(h=>h.id!==s.id && h.id<s.id && h.mode===s.mode && nm(h)===nm(s)).sort((x,y)=>y.id-x.id)[0] || null;
}
const normAns = v => Array.isArray(v) ? v.slice().sort().join('|') : (v||'');

/* Одна строка схемы: шкала из сегментов; по касанию раскрывается описание */
function scaleRow(p,i,a,prev){
  const v=a[p.id], has=answered(a,p), pv=prev?prev.ans[p.id]:null;
  const ks=Array.isArray(v)?v:(v?[v]:[]), pks=Array.isArray(pv)?pv:(pv?[pv]:[]);
  const cls = o => ks.includes(o.k) ? 'on' : (pks.includes(o.k) ? 'was' : '');
  const track = p.multi
    ? `<span class="chips">${p.opts.map(o=>`<i class="${cls(o)}">${o.k}</i>`).join('')}</span>`
    : `<span class="track${has?'':' none'}">${p.opts.map(o=>`<i class="${cls(o)}"></i>`).join('')}</span>
       <span class="ends"><span>${p.opts[0].k}</span><span>${p.opts[p.opts.length-1].k}</span></span>`;
  const body = ks.map(k=>{ const o=p.opts.find(o=>o.k===k); return `<p><b>${k}.</b> ${o.snd} <span class="muted">Образ: ${o.img}.</span></p>`; }).join('') || '<p class="muted">Шаг пропущен. Его можно отметить сейчас.</p>';
  const was = prev && normAns(v)!==normAns(pv) ? `<p class="muted">В прошлой карте: ${esc(ansText(prev.ans,p).toLowerCase())}.</p>` : '';
  return `<details class="sc" data-id="${p.id}" data-val="${esc(ansText(a,p))}"><summary>
    <span class="sc-top"><span class="sc-name"><b>${p.nameS} <span class="chev" aria-hidden="true">▾</span></b>${p.nameS!==p.name?`<small>${p.name}</small>`:''}</span>
    <span class="sc-val"><i class="dot l${p.lvl}"></i>${p.multi&&has?ks.length+' из '+p.opts.length:esc(ansText(a,p))}</span></span>
    ${track}</summary>
    <div class="sc-body stack">${body}${was}<p class="muted">Уровень уверенности: ${LEVELS[p.lvl].toLowerCase()}.</p>
    <button class="btn ghost small" data-step="${i}">${has?'Изменить этот шаг':'Отметить'}</button></div></details>`;
}

/* Экран результата: портрет → схема → что изменилось → разминка → советы → действия */
function vResult(){
  const a=cur.ans, pr=portrait(a), tp=tips(a), n=countAns(a), prev=prevOf(cur);
  const miss=PARAMS.findIndex(p=>!answered(a,p)), nm=PARAMS.length-n;
  let idx=0;
  const groups=GROUPS.map(g=>{ const from=idx; idx+=g.n;
    return `<h3 class="grp">${g.t}</h3>`+PARAMS.slice(from,from+g.n).map((p,j)=>scaleRow(p,from+j,a,prev)).join(''); }).join('');
  let changes;
  if(prev){
    const ch=PARAMS.filter(p=>normAns(a[p.id])!==normAns(prev.ans[p.id]));
    changes=`<div class="card stack" id="changes"><h2>Что изменилось с ${esc(prev.date)}</h2>
      ${ch.length?`<p>${ch.length===1?'Изменился':'Изменилось'} ${ch.length} ${plural(ch.length,'шаг','шага','шагов')} из ${PARAMS.length}:</p>`+ch.map(p=>`<p><b>${p.nameS}:</b> ${esc(ansText(prev.ans,p).toLowerCase())} → ${esc(ansText(a,p).toLowerCase())}</p>`).join('')+'<p class="muted">Остальное звучит так же. Контурный сегмент на шкале — прошлое положение.</p>'
        :'<p>Все шаги отмечены так же, как в прошлый раз. Это нормально: голос меняется медленно.</p>'}</div>`;
  } else {
    changes=`<div class="card stack" id="changes"><h2>Что изменилось</h2><p class="muted">${(cur.name||cur.mode==='self')?'Это первая карта с таким именем. Повторите диагностику через неделю — здесь появится сравнение.':'Чтобы сравнивать карты одного ученика, каждый раз указывайте одно и то же имя.'}</p></div>`;
  }
  /* План на 7 дней: советы карты по кругу, в последний день — повтор карты */
  const plan = tp.length ? `<details class="more card"><summary><span>План на 7 дней <span class="chev" aria-hidden="true">▾</span></span></summary><div class="stack">

    ${[0,1,2,3,4,5].map(d=>{ const t=tp[d%tp.length]; return `<p><b>День ${d+1}.</b> ${t.t} <span class="muted">Из шага ${t.step}.</span></p>`; }).join('')}
    <p><b>День 7.</b> Повторите карту и сравните с сегодняшней.</p></div></details>` : '';
  return `
  <div class="stack"><span class="muted">${esc(cur.date)} · отмечено ${n} из ${PARAMS.length}</span>
  <h1 tabindex="-1">${cur.name?esc(cur.name)+': карта голоса':'Карта голоса'}</h1></div>
  ${pr?`<div class="card sand stack"><h2>Портрет звука</h2><p>${cap(pr)}.</p><p class="muted">Это описание того, как голос звучит сейчас. Ни одно положение не является ошибкой само по себе: всё зависит от жанра и задачи.</p></div>`:''}
  <div class="card"><div class="stack"><h2>Карта звука</h2>
    <p class="muted">Каждая шкала — не «хуже–лучше», а «где сейчас». Коснитесь строки, чтобы прочитать описание.</p>
    <div class="legend"><span><i class="dot l1"></i>слышно и видно</span><span><i class="dot l2"></i>слышно по тембру</span><span><i class="dot l3"></i>предположение</span></div>
    ${nm?`<p class="muted">Не отмечено: ${nm} ${plural(nm,'шаг','шага','шагов')}.</p><button class="btn ghost small" style="align-self:flex-start" data-step="${miss}">Вернуться к ним</button>`:''}</div>
    ${groups}</div>
  ${changes}
  <div class="card stack"><h2>С чего начать</h2>
    <p>Сначала выравниваем дыхание и поток воздуха, потом работаем над звуком.</p>

  </div>
  ${tp.length?`<div class="card stack"><h2>Что попробовать после разминки</h2>${tp.map(t=>`<div class="tip"><b>${t.h}</b><span>${t.t}</span></div>`).join('')}</div>`:''}
  ${plan}
  ${storeOk?'':'<p class="stop">Не удалось сохранить карту на этом устройстве. Скопируйте её текстом, чтобы не потерять.</p>'}
  ${netLine()}
  <div class="stack">
    ${inTg?'<button class="btn wide" data-go="share" id="sh">Отправить карту педагогу</button>':''}
    <button class="btn ghost wide" data-go="copy" id="cp">${copyFail?'Не получилось — текст ниже':'Скопировать карту текстом'}</button>
    ${copyFail?`<label class="stack"><span class="muted">Выделите текст и скопируйте вручную:</span><textarea readonly id="cptxt">${esc(summaryText(cur))}</textarea></label>`:''}
    <button class="btn ghost wide" data-go="edit">Изменить ответы</button>
  </div>

}

/* Разминка: плеер с таймером, «Дальше: …», звук, неделя, правила остановки, справочник */

  ${top}
  <div class="card sand stack">

    <div class="timer" id="tm" role="timer">${fmt(timer.left)}</div>
    <p class="muted center" id="nxt">${nx?'Дальше: '+nx.n+', '+fmt(nx.t):'Дальше: конец разминки'}</p>
    <div class="row">

      <button class="btn ghost" data-go="tnext">${timer.i===WARMUP.length-1?'Сначала':'Следующее'}</button>
    </div>
    <button class="btn ghost wide" data-go="snd" aria-pressed="${soundOn}">${soundOn?'Звук включён':'Звук выключен'}</button>
    <p class="muted center">${soundOn?'Короткий сигнал прозвучит при смене упражнения.':'Упражнения сменятся без сигнала.'}${feel.b&&!timer.done?' До разминки: '+feel.b+' из 5.':''}</p>
  </div>
  <div class="sr" aria-live="polite">${timer.run?'Сейчас: '+s.n:''}</div>
  <div class="card"><ol class="steps">${WARMUP.map((w,i)=>`<li class="${i===timer.i?'on':i<timer.i?'done':''}"><time>${fmt(w.t)}</time><span>${w.n}</span></li>`).join('')}</ol></div>
  ${weekCard('warmup')}
  <div class="card stack"><h2>Остановитесь, если</h2>
    <div class="stop">появилась боль, ощущение кома в горле или закружилась голова;</div>
    <div class="stop">голос после упражнения стал хуже, чем до него.</div>
    <p class="muted">Охриплость дольше 2–3 недель — повод показаться ЛОРу или фониатру до продолжения занятий. Не делайте одно упражнение дольше 5 минут подряд. Трубочку мойте горячей водой и не делитесь ею.</p>

}

/* «О данных»: в веб-версии — прежний текст; в Telegram с сервером — краткая политика,
   состояние согласия и кнопка «Удалить мои данные» (и на сервере, и на устройстве) */

/* Экран согласия (только Telegram с подключённым сервером). Пока человек не нажал

/* Доступ ещё не открыт: сервер не нашёл человека в списке приглашённых */

/* =====================================================================
   НАВИГАЦИЯ И ОТРИСОВКА
   Адрес после # выбирает экран. render(true) — экран тот же: прокрутку
   не трогаем и возвращаем фокус на ту же кнопку. render() — новый экран:
   прокрутка наверх, фокус на заголовок.
   ===================================================================== */
const VIEWS = {welcome:vWelcome, start:vStart, check:vCheck, result:vResult, warmup:vWarm, about:vAbout, privacy:vPrivacy, consent:vConsent, closed:vClosed};
/* Telegram может дописать к адресу свои параметры (#tgWebAppData=… или #warmup&tgWebApp…):
   берём только начало до первого & или ?; всё незнакомое — стартовый экран. */
function route(){ const h=(location.hash||'#start').slice(1).split(/[&?]/)[0]; return ['start','check','result','warmup','about','privacy'].includes(h)?h:'start'; }
function focusKey(){ const el=document.activeElement; if(!el||!el.closest||!el.closest('#app')) return null; const d=el.dataset||{};
  for(const k of ['pick','mode','go','feel','del','open','step']) if(d[k]!==undefined) return [k,d[k],d.v];
  return el.id?['id',el.id]:null; }
function refocus(fk){ if(!fk) return;
  const el=[...document.querySelectorAll('#app button, #app input')].find(x=>fk[0]==='id'?x.id===fk[1]:(x.dataset[fk[0]]===fk[1]&&(fk[2]===undefined||x.dataset.v===fk[2])));
  if(el){ try{ el.focus({preventScroll:true}); }catch(e){} } }
function render(keep){
  if(booting) return;      /* Telegram ещё запускается: экран нарисует bootTg() */
  let r=route();
  /* Карты нет (например, открыли ссылку #result на другом устройстве) — честно уходим на старт */
  if((r==='check'||r==='result')&&!cur){ try{ location.replace('#start'); }catch(e){} r='start'; }
  /* Порядок: «закрыто» важнее всего; затем экран согласия; затем приветствие.
     «О системе» и «О данных» можно читать до любого ответа. */
  const info = r==='about'||r==='privacy';
  const scr = closed ? 'closed' : (needConsent()&&!info) ? 'consent' : (!seen&&!info) ? 'welcome' : r;
  if(!keep) copyFail=false;
  if(r!=='privacy') wipeNote='';
  curScr=scr; const nv=$('nav'); if(nv) nv.hidden=closed;
  const fk = keep ? focusKey() : null;
  $('#app').innerHTML = VIEWS[scr]();
  document.querySelectorAll('nav a').forEach(a=>{ const on=a.dataset.nav===r || (a.dataset.nav==='start'&&(r==='check'||r==='result')) || (a.dataset.nav==='about'&&r==='privacy'); a.classList.toggle('on',on); if(on) a.setAttribute('aria-current','page'); else a.removeAttribute('aria-current'); });
  if(keep) refocus(fk);
  else { window.scrollTo(0,0); const h=$('#app h1'); if(h){ try{ h.focus({preventScroll:true}); }catch(e){} } }
  tgSync();
}
function go(h){ if(location.hash==='#'+h) render(); else location.hash=h; }
/* Удаление и стирание — в два касания (системные окна подтверждения не используем) */
function sure(b,q){ if(b.dataset.sure) return true; b.dataset.sure='1'; b.textContent=q; return false; }

/* =====================================================================
   ТАЙМЕР РАЗМИНКИ
   Остаток считаем по настоящим часам (Date.now), а не вычитанием по секунде:
   так таймер не отстаёт в фоновой вкладке и при погашенном экране.
   ===================================================================== */
function stopTimer(){ clearInterval(timer.h); timer.run=false; }
function setStep(i){ timer.i=i; timer.left=WARMUP[i].t; if(timer.run) timer.end=Date.now()+timer.left*1000; }
function startTimer(){ clearInterval(timer.h); if(timer.done) feel={b:0,a:0};
  timer.done=false; timer.started=true; timer.run=true; timer.end=Date.now()+timer.left*1000; timer.h=setInterval(tick,250); }
function tick(){
  if(!timer.run) return;
  const ms=timer.end-Date.now();
  if(ms<=0){
    if(timer.i<WARMUP.length-1){   /* следующий шаг включается сам */
      timer.i++; timer.end=(ms<-2000?Date.now():timer.end)+WARMUP[timer.i].t*1000;
      timer.left=Math.max(1,Math.ceil((timer.end-Date.now())/1000)); beep(2);
    } else {                        /* конец разминки: отмечаем день */
      stopTimer(); timer.i=0; timer.left=WARMUP[0].t; timer.done=true; timer.started=false; markDay(); beep(3);
    }
    if(route()==='warmup'&&seen) render(!timer.done);
  } else { timer.left=Math.ceil(ms/1000); const el=$('#tm'); if(el) el.textContent=fmt(timer.left); }
}
/* Отметка дня в «неделе» вместе с самооценкой до/после */
function markDay(){ const k=dkey(new Date()); let r=days.find(x=>x.d===k); if(!r){ r={d:k,b:0,a:0}; days.push(r); }
  if(feel.b) r.b=feel.b; if(feel.a) r.a=feel.a; days=days.slice(-60); lsSet(WKEY,days); }

/* Звуковой сигнал смены упражнения. Звук создаётся только после нажатия «Старт»
   (браузеры не разрешают звук без действия человека); любая ошибка — просто тишина. */
let actx=null;
function audioInit(){ if(actx||!soundOn) return; try{ const C=window.AudioContext||window.webkitAudioContext; if(C) actx=new C(); }catch(e){ actx=null; } }
function beep(n){ if(!soundOn||!actx) return;
  try{ if(actx.state==='suspended') actx.resume();
    const t0=actx.currentTime;
    for(let k=0;k<n;k++){ const o=actx.createOscillator(), g=actx.createGain(), t=t0+k*0.22;
      o.type='sine'; o.frequency.value=880;
      g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.2,t+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+0.14);
      o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t+0.16); }
  }catch(e){} }

/* =====================================================================
   ДЕЙСТВИЯ: один обработчик на все нажатия. Кнопка сообщает, что делать,
   через атрибуты data-… в разметке экранов.
   ===================================================================== */
document.addEventListener('input', e=>{ if(e.target.id==='nm') draftName=e.target.value; });
document.addEventListener('keydown', e=>{ if(e.key==='Enter'&&e.target.id==='nm'){ const b=$('[data-go=begin]'); if(b) b.click(); } });
document.addEventListener('click', e=>{
  const b=e.target.closest('button'); if(!b||b.disabled) return;
  const d=b.dataset;
  if(d.mode){ draftMode=d.mode; render(true); return; }
  /* Выбор варианта. На последнем шаге «Не включается» (none) и остальные исключают друг друга */
  if(d.pick){ if(!cur) return; const p=PARAMS[cur.step], k=d.pick;
    if(p.multi){ const arr=cur.ans[p.id]||[], isNone=x=>!!(p.opts.find(o=>o.k===x)||{}).none;
      if(arr.includes(k)) cur.ans[p.id]=arr.filter(x=>x!==k);
      else if(isNone(k)) cur.ans[p.id]=[k];
      else cur.ans[p.id]=arr.filter(x=>!isNone(x)).concat(k);
      if(!cur.ans[p.id].length) delete cur.ans[p.id]; }
    else if(cur.ans[p.id]===k) delete cur.ans[p.id]; else cur.ans[p.id]=k;
    if(cur.done) persist();      /* правка готовой карты сохраняется сразу */
    saveCur(); render(true); return; }
  if(d.step!==undefined){ if(!cur) return; cur.step=Math.min(Math.max(+d.step||0,0),PARAMS.length-1); saveCur(); go('check'); return; }
  if(d.feel){ feel[d.feel]=clamp5(d.v); if(timer.done) markDay(); render(true); return; }
  /* Открываем копию прошлой карты, чтобы незаконченная правка не портила список */
  if(d.open!==undefined){ const s=hist[+d.open]; if(!s) return; cur=JSON.parse(JSON.stringify(s)); cur.done=true; cur.step=0; saveCur(); go('result'); return; }
  if(d.del!==undefined){
    if(!sure(b,'Точно удалить?')) return;
    const gone=hist.splice(+d.del,1)[0]; if(cur&&gone&&cur.id===gone.id){ cur=null; lsDel(OKEY); }
    saveHist(); render(true); Store.remove(gone); return; }
  switch(d.go){
    case 'seen': seen=true; lsSet(SKEY,{v:1,d:dkey(new Date())}); render(); break;
    case 'welcome': seen=false; go('start'); break;
    case 'begin':
      if(draft&&(countAns(draft.ans)>0||draft.step>0)&&!sure(b,'Стереть незаконченную и начать?')) return;
      cur={id:Date.now(), mode:draftMode, name:draftName.trim().slice(0,40), date:new Date().toLocaleDateString('ru-RU'), ans:{}, step:0, done:false};
      draftName=''; lsDel(OKEY); saveCur(); go('check'); break;
    case 'resume': if(draft){ cur=draft; lsDel(OKEY); go('check'); } break;
    case 'drop': if(!sure(b,'Точно стереть?')) return; if(cur===draft) cur=null; draft=null; lsDel(DKEY); render(true); break;
    case 'prev': if(cur&&cur.step>0){ cur.step--; saveCur(); render(); } break;
    case 'next': if(!cur) return;
      if(cur.step<PARAMS.length-1){ cur.step++; saveCur(); render(); }
      else { /* последний шаг: карта готова; пустую в список не кладём */
        if(!cur.done){ cur.done=true; if(draft===cur) draft=null; lsDel(DKEY); }
        if(countAns(cur.ans)>0||hist.some(s=>s.id===cur.id)) persist();
        saveCur(); go('result'); }
      break;
    case 'toresult': go('result'); break;
    case 'edit': if(cur){ cur.step=0; saveCur(); go('check'); } break;
    case 'copy': { /* буфер обмена может быть недоступен — тогда показываем текст для ручного копирования */
      let pr; try{ pr=navigator.clipboard.writeText(summaryText(cur)); }catch(err){ pr=Promise.reject(err); }
      pr.then(()=>{ b.textContent='Скопировано'; }).catch(()=>{ copyFail=true; if(route()==='result') render(true); });
      break; }
    case 'tgl':
      if(timer.run){ stopTimer(); render(true); }
      else { audioInit(); startTimer(); render(true); }
      break;
    case 'tnext': setStep(timer.i===WARMUP.length-1?0:timer.i+1); render(true); break;
    case 'snd': soundOn=!soundOn; lsSet(PKEY,{sound:soundOn}); render(true); break;
    case 'markday': markDay(); render(true); break;
    case 'wipe':
      if(!sure(b,'Точно стереть всё?')) return;
      wipeLocal(); go('start'); break;
    /* «Удалить мои данные» (Telegram): в два касания, и на сервере, и на устройстве */
    case 'wipeall':
      if(!sure(b,'Точно удалить всё?')) return;
      b.disabled=true; b.textContent='Удаляем…';
      Store.wipe().then(srv=>{
        wipeNote = srv===false ? 'На этом устройстве всё удалено. До сервера достучаться не удалось: отправьте боту команду /delete или повторите позже.'
          : 'Готово: данные удалены на сервере и на этом устройстве.';
        go('privacy'); });
      break;
    case 'consent-yes': Store.setConsent(true); render(); break;
    case 'consent-no': Store.setConsent(false); render(); break;
    case 'consent-again': consent=null; lsDel(CKEY); go('start'); break;
    /* «Отправить карту педагогу»: окно Telegram «переслать»; не вышло — копируем текст */
    case 'share':
      if(cur&&tgShare(summaryText(cur))) break;
      { const c=$('#cp'); if(c) c.click(); }
      break;
  }
});
/* Внешняя ссылка (политика) внутри Telegram открывается его средствами, без ухода со страницы */
document.addEventListener('click', e=>{ const a=e.target.closest&&e.target.closest('a[data-ext]');
  if(a&&inTg&&tg.openLink){ e.preventDefault(); tgSafe(()=>tg.openLink(a.href)); } });
window.addEventListener('hashchange', ()=>render());
/* Вернулись во вкладку — сразу пересчитываем таймер по часам */
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden&&timer.run) tick(); });
/* Запуск. Обычный браузер — сразу рисуем, как раньше (ни одного запроса наружу).
   Похоже на Telegram — сначала подключаемся к нему. */
if(tgLooks()) bootTg(); else render();
</script>
