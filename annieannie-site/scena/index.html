<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Готовы ли вы к сцене · от Annie</title><meta name="description" content="10 пунктов, которые стоит проверить перед выступлением, караоке или отчётным концертом."><meta name="referrer" content="no-referrer"><meta name="theme-color" content="#6E1423">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data:; manifest-src 'self'; base-uri 'none'; form-action 'none'">
<link rel="icon" href="../icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="../apple-touch-icon.png"><link rel="canonical" href="https://annieanniekartagolosa.netlify.app/scena/">
<meta property="og:type" content="website"><meta property="og:locale" content="ru_RU"><meta property="og:title" content="Готовы ли вы к сцене · от Annie"><meta property="og:description" content="10 пунктов, которые стоит проверить перед выступлением, караоке или отчётным концертом.">
<meta property="og:url" content="https://annieanniekartagolosa.netlify.app/scena/"><meta property="og:image" content="https://annieanniekartagolosa.netlify.app/og.jpg"><meta name="twitter:card" content="summary_large_image">
<style>:root{color-scheme:light;--wine:#6E1423;--deep:#4A0D18;--sand:#EFE4D6;--paper:#FBF7F2;--ink:#2A1A1D;--muted:#7A6468;--line:#DFD0BF;--white:#fff;--ok:#2F6B4F;--no:#9A3B12}
*{box-sizing:border-box}html,body{margin:0;height:100%}body{background:var(--paper);color:var(--ink);font:17px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
main{max-width:560px;margin:0 auto;padding:18px 16px 60px;display:flex;flex-direction:column;gap:16px}
h1{font-size:28px;line-height:1.15;font-weight:800;letter-spacing:-.02em;color:var(--deep);margin:0;text-wrap:balance}
h2{font-size:20px;line-height:1.2;font-weight:800;color:var(--deep);margin:0;text-wrap:balance}p{margin:0}
a{color:var(--wine);font-weight:600}.muted{color:var(--muted);font-size:14px}.top{display:inline-block;padding:10px 0;font-size:15px}
.card{background:var(--white);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px}.card.sand{background:var(--sand);border-color:transparent}
button{font:inherit;cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--wine);outline-offset:2px}
.btn{background:var(--wine);color:#fff;border:0;border-radius:12px;padding:14px 18px;font-weight:700;min-height:48px;width:100%}
.btn.ghost{background:transparent;color:var(--wine);border:1.5px solid var(--wine)}
.opt{display:block;width:100%;text-align:left;background:var(--white);border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;color:var(--ink);min-height:52px;font-weight:600}
.opt.right{border-color:var(--ok);background:#EAF3EE}.opt.wrong{border-color:var(--no);background:#F8EAE3}.opt.on{border-color:var(--wine);background:var(--sand);box-shadow:inset 4px 0 0 var(--wine)}
.opt:disabled{cursor:default;opacity:1}.opt .n{display:inline-block;min-width:28px;font-weight:800;color:var(--wine)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.two .opt{text-align:center}
.bar{height:6px;background:var(--sand);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--wine);border-radius:6px}
.fb{border-left:4px solid var(--wine);padding:2px 0 2px 12px;font-size:15px}.fb.ok{border-color:var(--ok)}.fb.no{border-color:var(--no)}
.big{font-size:44px;font-weight:800;color:var(--deep);letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1}
.chip{display:inline-block;font-size:12px;font-weight:700;padding:3px 10px;border-radius:20px;background:var(--deep);color:#fff;align-self:flex-start}
.timer{font-weight:800;color:var(--wine);font-variant-numeric:tabular-nums}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.tile{display:block;text-decoration:none;background:var(--white);border:1px solid var(--line);border-radius:14px;padding:14px 16px;color:var(--ink);font-weight:400}
.tile b{display:block;font-size:17px;color:var(--deep);font-weight:800}.tile span{display:block;font-size:14px;color:var(--muted);margin-top:2px}.tile em{font-style:normal;font-size:12px;font-weight:700;color:var(--wine)}
.tile.main{background:var(--wine);border-color:var(--wine)}.tile.main b{color:#fff;font-size:20px}.tile.main span{color:#EFD9C0}.tile.main em{color:#fff}
input[type=text]{font:inherit;width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);text-transform:uppercase}
ul.tips{margin:0;padding-left:20px;font-size:15px}ul.tips li{margin:6px 0}
textarea{font:inherit;font-size:14px;width:100%;min-height:90px;border:1.5px solid var(--line);border-radius:12px;padding:10px}
@media (max-width:380px){h1{font-size:25px}}</style></head><body><main id="app"></main>
<script>
const Q = {"slug": "scena", "code": "СЦЕНА", "type": "check", "title": "Готовы ли вы к сцене", "lead": "10 пунктов, которые стоит проверить перед выступлением, караоке или отчётным концертом.", "time": "2 минуты", "q": [["Знаю слова наизусть", "Пропойте текст без музыки, как стихотворение, два раза подряд."], ["Спел(а) песню целиком стоя хотя бы три раза", "Спойте песню от начала до конца стоя, без остановок."], ["Знаю, в какой тональности мне удобно", "Проверьте самое высокое место. Если давит — попросите тональность ниже."], ["Знаю первую ноту и первые слова", "Послушайте вступление и трижды спойте только первую фразу."], ["Сегодня разогрел(а) голос", "Сделайте разминку на 8 минут из «Карты голоса»."], ["Пил(а) воду в течение дня", "Держите рядом воду комнатной температуры."], ["Нормально спал(а)", "Если не выспались, пойте чуть тише и не добавляйте сложных мест."], ["Проверил(а) микрофон и минусовку", "Спойте в микрофон одну фразу до начала: услышите громкость и расстояние."], ["Есть план, если забуду слова", "Договоритесь с собой: пропеть мелодию на «ла-ла» и войти со следующей строки."], ["Знаю, куда смотреть и что делать с руками", "Выберите три точки в зале и переводите взгляд между ними."]], "levels": [[0, "Пока рано", "Не страшно: по списку ниже видно, с чего начать."], [6, "Почти готовы", "Осталось закрыть несколько пунктов."], [9, "Можно выходить", "Вы готовы. Получайте удовольствие."]]}, CH = {"name": "@annieanniemusic", "url": "", "text": "Новые пробы, разборы звучания и разминки выходят в канале Annie."}, KEY = 'annie.quiz.' + Q.slug;
const $ = s => document.querySelector(s), app = $('#app');
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
/* Состояние одной игры. Ничего не отправляется: результат сохраняется только в браузере. */
let S = {i:0, score:0, ans:[], picked:null, left:Q.timer||0, th:null, order:[], cats:{}, checks:[]};
function save(r){ try{ localStorage.setItem(KEY, JSON.stringify({r, at:Date.now()})); }catch(e){} }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function level(n){ let l=Q.levels[0]; Q.levels.forEach(x=>{ if(n>=x[0]) l=x; }); return l; }
function head(){ return `<a class="top" href="../">← Все инструменты</a>`; }
function vIntro(){
  return head()+`<span class="chip">Черновая версия</span><h1>${esc(Q.title)}</h1><p>${esc(Q.lead)}</p>
  <p class="muted">Займёт: ${esc(Q.time)}. Микрофон не нужен, ответы никуда не отправляются.</p>
  <button class="btn" data-a="start">Начать</button>`;
}
function progress(){ const n=Q.q.length; return `<div class="row"><span class="muted">${Math.min(S.i+1,n)} из ${n}</span>${Q.timer?`<span class="timer" id="tm">0:${String(S.left).padStart(2,'0')}</span>`:''}</div><div class="bar"><i style="width:${(S.i)/n*100}%"></i></div>`; }
function vQuiz(){
  const q=Q.q[S.i], opts=Q.opts||q[1], right=Q.opts?q[1]:q[2], exp=Q.opts?q[2]:q[3], done=S.picked!==null;
  return head()+progress()+`<h2>${esc(q[0])}</h2>
  <div class="${opts.length===2?'two':''}" style="display:${opts.length===2?'grid':'flex'};flex-direction:column;gap:10px">
  ${opts.map((o,k)=>`<button class="opt ${done?(k===right?'right':(k===S.picked?'wrong':'')):''}" data-a="pick" data-k="${k}" ${done?'disabled':''}>${esc(o)}</button>`).join('')}</div>
  ${done?`<div class="fb ${S.picked===right?'ok':'no'}"><b>${S.picked===right?'Верно.':'Не совсем.'}</b> ${esc(exp)}</div><button class="btn" data-a="next" id="nx">${S.i===Q.q.length-1?'Результат':'Дальше'}</button>`:''}`;
}
function vProfile(){
  const q=Q.q[S.i];
  return head()+progress()+`<h2>${esc(q[0])}</h2><div style="display:flex;flex-direction:column;gap:10px">
  ${q[1].map((o,k)=>`<button class="opt" data-a="cat" data-k="${k}">${esc(o[0])}</button>`).join('')}</div>`;
}
function vCheck(){
  return head()+`<h1>${esc(Q.title)}</h1><p class="muted">Отметьте то, что уже сделано.</p>
  <div style="display:flex;flex-direction:column;gap:10px">${Q.q.map((q,k)=>`<button class="opt ${S.checks[k]?'on':''}" data-a="chk" data-k="${k}" aria-pressed="${!!S.checks[k]}"><span class="n">${S.checks[k]?'✓':'○'}</span>${esc(q[0])}</button>`).join('')}</div>
  <button class="btn" data-a="chkdone">Показать результат</button>`;
}
function vOrder(){
  const placed=S.order.length;
  return head()+`<h1>${esc(Q.title)}</h1><p class="muted">Нажимайте упражнения по порядку: что идёт первым, вторым и так далее. Собрано ${placed} из ${Q.q.length}.</p>
  <div class="bar"><i style="width:${placed/Q.q.length*100}%"></i></div>
  ${S.msg?`<div class="fb ${S.msgOk?'ok':'no'}">${esc(S.msg)}</div>`:''}
  <div style="display:flex;flex-direction:column;gap:10px">${S.shuf.map(k=>{ const pos=S.order.indexOf(k); return `<button class="opt ${pos>=0?'right':''}" data-a="ord" data-k="${k}" ${pos>=0?'disabled':''}><span class="n">${pos>=0?pos+1:'·'}</span>${esc(Q.q[k][0])}</button>`; }).join('')}</div>`;
}
function share(text){ return `<div class="card sand"><h2>Продолжение — у Annie</h2><p>${esc(CH.text)}</p>${CH.url?`<a href="${esc(CH.url)}" rel="noopener" target="_blank">${esc(CH.name)}</a>`:`<p><b>${esc(CH.name)}</b></p>`}</div>
  <button class="btn ghost" data-a="copy" data-t="${esc(text)}" id="cp">Скопировать результат</button>
  <button class="btn ghost" data-a="again">Пройти ещё раз</button>
  <a class="tile main" href="../karta/"><b>Карта голоса</b><span>12 коротких проб — и вы видите карту своего звука</span></a>
  <a class="top" href="../">Все инструменты от Annie</a>`; }
function vResult(){
  let body='', text='';
  if(Q.type==='quiz'){ const n=Q.q.length, l=level(S.score); save(S.score);
    body=`<div class="card"><div class="big">${S.score} из ${n}</div><h2>${esc(l[1])}</h2><p>${esc(l[2])}</p>${S.timeout?'<p class="muted">Время вышло: неотвеченные карточки не засчитаны.</p>':''}</div>`;
    if(Q.timer){ const o=Q.opts; body+=`<div class="card"><h2>Разбор</h2><ul class="tips">${Q.q.map(x=>`<li><b>${esc(x[0])}.</b> ${esc(x[2])}</li>`).join('')}</ul></div>`; }
    text=`«${Q.title}»: ${S.score} из ${n}. ${l[1]}.`; }
  if(Q.type==='profile'){ let best=null; Object.keys(Q.res).forEach(c=>{ if(best===null||(S.cats[c]||0)>(S.cats[best]||0)) best=c; }); const r=Q.res[best]; save(best);
    body=`<div class="card"><h2>${esc(r[0])}</h2><p>${esc(r[1])}</p><div class="fb">${esc(r[2])}</div><p class="muted">${esc(Q.note||'')}</p></div>`;
    text=`«${Q.title}»: ${r[0]}.`; }
  if(Q.type==='check'){ const n=Q.q.length, sc=S.checks.filter(Boolean).length, l=level(sc); save(sc); const miss=Q.q.filter((q,k)=>!S.checks[k]);
    body=`<div class="card"><div class="big">${sc} из ${n}</div><h2>${esc(l[1])}</h2><p>${esc(l[2])}</p></div>${miss.length?`<div class="card"><h2>Что сделать</h2><ul class="tips">${miss.map(q=>`<li><b>${esc(q[0])}.</b> ${esc(q[1])}</li>`).join('')}</ul></div>`:''}`;
    text=`«${Q.title}»: ${sc} из ${n}. ${l[1]}.`; }
  if(Q.type==='order'){ save(S.miss||0);
    body=`<div class="card"><h2>${esc(Q.done[0])}</h2><p>${esc(Q.done[1])}</p><p class="muted">Ошибок по пути: ${S.miss||0}.</p></div><div class="card"><h2>Почему такой порядок</h2><ul class="tips">${Q.q.map((q,k)=>`<li><b>${k+1}. ${esc(q[0])}.</b> ${esc(q[1])}</li>`).join('')}</ul></div>`;
    text=`«${Q.title}»: собрано, ошибок ${S.miss||0}.`; }
  return head()+`<span class="chip">Результат</span>`+body+share(text+' Инструменты для голоса от Annie');
}
let view='intro';
function render(focusSel){
  app.innerHTML = view==='intro'?vIntro(): view==='result'?vResult(): Q.type==='quiz'?vQuiz(): Q.type==='profile'?vProfile(): Q.type==='check'?vCheck(): vOrder();
  const f=focusSel&&$(focusSel); if(f) f.focus(); else if(view!=='play'||S.picked===null) window.scrollTo(0,0);
}
function stopTimer(){ clearInterval(S.th); S.th=null; }
function start(){
  S={i:0,score:0,ans:[],picked:null,left:Q.timer||0,th:null,order:[],cats:{},checks:[],miss:0,msg:'',shuf:Q.type==='order'?shuffle(Q.q.map((_,k)=>k)):[]};
  if(Q.type==='order'){ while(S.shuf.every((k,i)=>k===i)) S.shuf=shuffle(S.shuf); }
  view='play';
  if(Q.timer){ const end=Date.now()+Q.timer*1000; S.th=setInterval(()=>{ S.left=Math.max(0,Math.ceil((end-Date.now())/1000)); const t=$('#tm'); if(t) t.textContent='0:'+String(S.left).padStart(2,'0'); if(S.left<=0){ stopTimer(); S.timeout=true; view='result'; render(); } },250); }
  render();
}
document.addEventListener('click', e=>{
  const b=e.target.closest('[data-a]'); if(!b) return; const a=b.dataset.a, k=+b.dataset.k;
  if(a==='start'||a==='again'){ stopTimer(); start(); }
  else if(a==='pick'){ if(S.picked!==null) return; const q=Q.q[S.i], right=Q.opts?q[1]:q[2]; S.picked=k; if(k===right) S.score++;
    if(Q.timer){ S.i++; S.picked=null; if(S.i>=Q.q.length){ stopTimer(); view='result'; } render(); } else render('#nx'); }
  else if(a==='next'){ S.i++; S.picked=null; if(S.i>=Q.q.length) view='result'; render(); }
  else if(a==='cat'){ const c=Q.q[S.i][1][k][1]; S.cats[c]=(S.cats[c]||0)+1; S.i++; if(S.i>=Q.q.length) view='result'; render(); }
  else if(a==='chk'){ S.checks[k]=!S.checks[k]; const y=window.scrollY; render(); window.scrollTo(0,y); }
  else if(a==='chkdone'){ view='result'; render(); }
  else if(a==='ord'){ const need=S.order.length; const y=window.scrollY;
    if(k===need){ S.order.push(k); S.msg=Q.q[k][1]; S.msgOk=true; if(S.order.length===Q.q.length){ view='result'; render(); return; } }
    else { S.miss++; S.msg='Пока рано. Подумайте, какое упражнение мягче.'; S.msgOk=false; }
    render(); window.scrollTo(0,y); }
  else if(a==='copy'){ const t=b.dataset.t; (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>{ b.textContent='Скопировано'; }).catch(()=>{ const ta=document.createElement('textarea'); ta.value=t; ta.readOnly=true; b.replaceWith(ta); ta.focus(); ta.select(); }); }
});
render();
</script></body></html>
